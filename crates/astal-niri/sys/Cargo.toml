[package]
name = "astal-niri-sys"
edition = "2021"
description = "FFI Bindings for libatstal and its libraries"
authors.workspace = true
categories.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
build = "build.rs"

[package.metadata.system-deps.astal_niri]
name = "astal-niri-0.1"
version = "0.1"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
all-features = true

[lib]
name = "astal_niri_sys"

[dependencies]
libc.workspace = true
glib-sys.workspace = true
gobject-sys.workspace = true
gio-sys.workspace = true
json-glib-sys.workspace = true

[build-dependencies]
system-deps = "7"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
