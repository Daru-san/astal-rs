name: Documentation

on:
  push:
    branches:
      - master

jobs:
  docs:
    permissions:
      contents: write
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v20

      - name: Build documentation
        run: RUSTDOCFLAGS="--html-in-header katex-header.html" nix develop --command cargo doc --no-deps --workspace

      - name: Finalize documentation
        run: |
          CRATE_NAME=$(echo 'astal4' | tr '[:upper:]' '[:lower:]' | cut -f2 -d"/")
          echo "<meta http-equiv=\"refresh\" content=\"0; url=${CRATE_NAME/-/_}\">" > target/doc/index.html
          touch target/doc/.nojekyll

      - name: Upload as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Documentation
          path: target/doc

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/doc
